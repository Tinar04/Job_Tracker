<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — JobTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f1f3d; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; }
        .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; color: #0f1f3d; margin-bottom: 0.25rem; }
        .brand span { color: #f5a623; }
        .login-box h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; color: #0f1f3d; margin-bottom: 0.25rem; }
        .login-box p { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
        .form-control { border-radius: 8px; border: 1px solid #e5e7eb; padding: 0.7rem 1rem; font-size: 0.9rem; }
        .form-control:focus { border-color: #1a3a6b; box-shadow: 0 0 0 3px rgba(26,58,107,0.1); }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #0f1f3d; }
        .btn-login { background: #f5a623; color: #0f1f3d; font-weight: 700; border: none; width: 100%; padding: 0.8rem; border-radius: 8px; font-size: 0.95rem; transition: all 0.2s; }
        .btn-login:hover { background: #fbbf47; transform: translateY(-1px); }
        .register-link { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #6b7280; }
        .register-link a { color: #1a3a6b; font-weight: 600; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand mb-3">Job<span>Tracker</span></div>
        <h2>Get started👋</h2>
        <p>Create Your Free Account</p>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger" style="font-size:0.8rem;">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-login mt-2">Create Account</button>
        </form>
        <div class="register-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</body>
</html>
